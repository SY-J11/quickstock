<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>퀵스톡 | 종목 정보</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">Q</span><div><strong>퀵스톡</strong><small>QUICK STOCK LOOKUP</small></div></div>
    <span class="demo-badge">데모 화면</span>
  </header>
  <main class="wrap">
    <section class="intro">
      <p class="eyebrow">MY STOCK DASHBOARD</p>
      <h1>종목 정보를<br><span>한 화면에서 빠르게</span></h1>
      <p class="sub">현재가는 시세 공급원 연결 후 표시됩니다. 지금은 화면 구성을 확인하는 예시 모드입니다.</p>
    </section>
    <section class="search-panel">
      <label for="stockSearch">종목명 또는 6자리 종목코드</label>
      <div class="search-row">
        <input id="stockSearch" type="search" placeholder="예: 삼성전자 또는 005930" autocomplete="off">
        <button id="searchBtn">조회</button>
      </div>
      <div id="suggestions" class="suggestions" hidden></div>
      <div class="quick-list" id="quickList"></div>
    </section>
    <section id="stockView" class="stock-view" aria-live="polite"></section>
    <section class="notice">
      <strong>데이터 연결 전 안내</strong>
      <p>현재 숫자는 화면 테스트용 예시입니다. 실제 시세·재무·컨센서스 데이터가 아닙니다. 실제 데이터 연결 전에는 투자 판단에 사용하지 마세요.</p>
    </section>
    <footer>퀵스톡 · 개인용 종목 조회 웹앱 · 데이터 공급원 연결 전</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
